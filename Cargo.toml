[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = "0.4.45"
config = "0.15.23"
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["json"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
sha3 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-actix-web = "0.7.21"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.23.3", features = ["v4"] }
validator = "0.20.0"

[dev-dependencies]
claims = "0.8.0"
fake = "5.1.0"
linkify = "0.11.0"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
serde_json = "1.0.150"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6.5"

[profile.dev.package.sqlx-macros]
opt-level = 3
