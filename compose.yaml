services:
  postgres:
    image: postgres:18
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-newsletter}
    command: postgres -N 1000
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ 'CMD', 'pg_isready' ]
      interval: 1s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
